name: R-CMD-check

on:
  pull_request:
    paths:
      - 'R/**'
      - 'src/**'
      - 'tests/**'
      - 'man/**'
      - 'man-roxygen/**'
      - 'vignettes/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/test.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          #- {os: ubuntu-26.04,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-26.04,   r: 'release'}
          #- {os: ubuntu-26.04,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Every Suggests that CRAN offers for this platform. Unix-only ones
      # (doMC) are not built for Windows and are left out there.
      - name: List installable Suggests
        id: suggests
        shell: Rscript {0}
        run: |
          s <- read.dcf("DESCRIPTION", "Suggests")[1, ]
          s <- if (is.na(s)) character() else trimws(sub("\\(.*", "", strsplit(s, ",")[[1]]))
          s <- intersect(s, rownames(available.packages(repos = "https://cloud.r-project.org")))
          cat(sprintf("packages=%s\n", paste0("any::", s, collapse = " ")),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          # Cache the installed R-package tree keyed on DESCRIPTION +
          # the OS / R-version pair; rebuilds only when DESCRIPTION
          # changes. Saves ~3-5 min per leg.
          cache: true
          extra-packages: |
            ${{ steps.suggests.outputs.packages }}
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
