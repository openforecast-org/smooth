name: Python Tests

on:
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python_ci.yml'
  workflow_dispatch:

# Opt every JavaScript action into the Node.js 24 runtime. GitHub
# deprecates Node.js 20 on 2026-06-02 and removes it on 2026-09-16;
# this env var is the documented opt-in mechanism for the transition
# period. Every action pinned below now targets Node 24 on its own, so
# this is belt and braces -- it still covers anything an action pulls
# in transitively.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          # Cache pip's download tree so ``pip install ruff mypy`` hits
          # the cache on subsequent runs. ``cache: 'pip'`` keys on every
          # discoverable lockfile / requirements file in the checkout;
          # there isn't one for ruff+mypy specifically, so the key
          # degrades to the python-version + OS pair, which is fine —
          # ruff/mypy are pinned in the Install step below anyway.
          cache: 'pip'

      - name: Install ruff and mypy
        run: pip install ruff mypy

      - name: Run ruff linter
        run: ruff check python/src/smooth/

      - name: Run ruff formatter check
        run: ruff format --check python/src/smooth/

      - name: Run mypy
        working-directory: python
        run: mypy src/smooth

  build-and-test:
    name: Build & Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-26.04
            python-version: "3.11"
            cibw-build: "cp311-manylinux*"
          - os: ubuntu-26.04
            python-version: "3.12"
            cibw-build: "cp312-manylinux*"
          - os: ubuntu-26.04
            python-version: "3.13"
            cibw-build: "cp313-manylinux*"
          - os: ubuntu-26.04
            python-version: "3.14"
            cibw-build: "cp314-manylinux*"
          # macOS
          - os: macos-latest
            python-version: "3.11"
            cibw-build: "cp311-macosx*"
          # Windows — pin to windows-2025 (a stable VS17 toolchain on
          # GitHub's image) rather than ``windows-latest``, which rolls to
          # preview toolchains.
          - os: windows-2025
            python-version: "3.11"
            cibw-build: "cp311-win_amd64"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The reference (netlib) BLAS / LAPACK, as R's default: the order in which
      # a BLAS sums matrix products sets the last bits of the fits, so with
      # OpenBLAS Python did not match R (see python/CMakeLists.txt). On Windows,
      # MSYS2's build, whose MinGW import libs MSVC links.
      - name: Install the reference BLAS / LAPACK (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          location: D:\
          update: false
          install: mingw-w64-x86_64-lapack

      # Cache Homebrew's bottle download tree on macOS. ``brew install
      # lapack`` still runs (so symlinks / dependency-resolution stay
      # correct) but skips the bottle download on cache hit.
      - name: Cache Homebrew downloads (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-lapack-${{ runner.os }}-${{ runner.arch }}

      - name: Build and test with cibuildwheel
        uses: pypa/cibuildwheel@v4.3.1
        with:
          package-dir: python
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.cibw-build }}
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: x86_64 arm64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BEFORE_ALL_LINUX: |
            yum install -y blas-devel lapack-devel pkgconfig || \
            (apt-get update && apt-get install -y libblas-dev liblapack-dev pkg-config)
          CIBW_ENVIRONMENT_LINUX: >
            PKG_CONFIG_PATH="/usr/lib64/pkgconfig:/usr/lib/pkgconfig"
            CMAKE_ARGS="-DBLA_VENDOR=Generic"
          # Homebrew's ``lapack`` is netlib's (keg-only), with the reference BLAS
          CIBW_BEFORE_ALL_MACOS: brew install lapack
          CIBW_ENVIRONMENT_MACOS: >
            CMAKE_ARGS="-DBLAS_LIBRARIES=$(brew --prefix lapack)/lib/libblas.dylib
            -DLAPACK_LIBRARIES=$(brew --prefix lapack)/lib/liblapack.dylib"
          # ``delvewheel`` bundles MSYS2's ``libblas.dll``, ``liblapack.dll`` and
          # their MinGW runtime DLLs (``libgfortran-5.dll``, ``libgcc_s_seh-1.dll``,
          # ``libquadmath-0.dll``, ``libwinpthread-1.dll``) into the wheel.
          CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
          CIBW_ENVIRONMENT_WINDOWS: >
            CMAKE_ARGS="-DBLAS_LIBRARIES=D:/msys64/mingw64/lib/libblas.dll.a
            -DLAPACK_LIBRARIES=D:/msys64/mingw64/lib/liblapack.dll.a"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair -w {dest_dir} {wheel} --add-path D:/msys64/mingw64/bin
          CIBW_TEST_REQUIRES: pytest numpy
          CIBW_TEST_COMMAND: pytest {project}/python/tests -v --tb=short

  # Python against R on the same machine. R's own results differ between
  # platforms (macOS arm64 has no long double, so sum() and mean() accumulate in
  # double there), so the fixed references of the default suite, made by R on
  # Linux, cannot check the other platforms: these tests ask the local R source
  # (tests/_r_bridge.py, pkgload::load_all) for its values instead. Both sides
  # use the reference BLAS / LAPACK.
  r-parity:
    name: R parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-2025]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          cache: true
          extra-packages: |
            any::pkgload
            any::jsonlite

      - name: Install the reference BLAS / LAPACK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev
          # R and Python both on the reference libraries, not on an OpenBLAS
          # alternative of the image
          sudo update-alternatives --set libblas.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/blas/libblas.so.3
          sudo update-alternatives --set liblapack.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/lapack/liblapack.so.3

      - name: Install the reference BLAS / LAPACK (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install lapack
          echo "CMAKE_ARGS=-DBLAS_LIBRARIES=$(brew --prefix lapack)/lib/libblas.dylib -DLAPACK_LIBRARIES=$(brew --prefix lapack)/lib/liblapack.dylib" >> "$GITHUB_ENV"

      - name: Install the reference BLAS / LAPACK (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          location: D:\
          update: false
          install: mingw-w64-x86_64-lapack

      - name: The BLAS of R
        shell: Rscript {0}
        run: |
          si <- sessionInfo()
          cat("BLAS:", si$BLAS, "\nLAPACK:", si$LAPACK, "\n")
          cat("long double:", capabilities("long.double"), .Machine$sizeof.longdouble, "\n")

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A wheel, repaired as in the wheel builds: on Windows, Python does not look
      # for the DLLs of an extension (MSYS2's libblas.dll) on PATH, so delvewheel
      # bundles them
      - name: Build smooth for Python
        shell: bash
        run: |
          python -m pip install pytest
          if [ "$RUNNER_OS" = "Windows" ]; then
            export CMAKE_ARGS="-DBLAS_LIBRARIES=D:/msys64/mingw64/lib/libblas.dll.a -DLAPACK_LIBRARIES=D:/msys64/mingw64/lib/liblapack.dll.a"
            python -m pip install delvewheel
            python -m pip wheel ./python --no-deps -w dist
            delvewheel repair -w wheelhouse dist/*.whl --add-path D:/msys64/mingw64/bin
            python -m pip install wheelhouse/*.whl
          else
            if [ "$RUNNER_OS" = "Linux" ]; then
              export CMAKE_ARGS="-DBLA_VENDOR=Generic"
            fi
            python -m pip install ./python
          fi

      - name: R parity tests
        working-directory: python
        run: python -m pytest tests -m "r_parity or r_comparison" --tb=short -q
